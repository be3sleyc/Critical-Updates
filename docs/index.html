<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; color: #333; margin: 10px; background-color: transparent; }
        .title { font-size: 14px; font-weight: bold; color: #106eba; margin-bottom: 12px; border-bottom: 2px solid #106eba; padding-bottom: 4px; }
        .update-item { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .update-link { text-decoration: none; font-weight: bold; color: #d13438; display: block; margin-bottom: 2px; }
        .date { font-size: 11px; color: #666; }
    </style>
</head>
<body>
    <div class="title">Current Microsoft Security Releases</div>
    <div id="content">Loading live patch data...</div>

    <script>
        const rssUrl = encodeURIComponent('https://api.msrc.microsoft.com/update-guide/rss');
        fetch(`https://rss2json.com{rssUrl}`)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('content');
                container.innerHTML = '';
                if(data.status === 'ok') {
                    data.items.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'update-item';
                        div.innerHTML = `
                            <a class="update-link" href="${item.link}" target="_blank">${item.title}</a>
                            <span class="date">Published: ${new Date(item.pubDate).toLocaleDateString()}</span>
                        `;
                        container.appendChild(div);
                    });
                } else { container.innerText = 'Failed to load update feed.'; }
            }).catch(() => { document.getElementById('content').innerText = 'Error loading feed.'; });
    </script>
</body>
</html>
