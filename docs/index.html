<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; color: #333; margin: 10px; background-color: transparent; }
        .title { font-size: 14px; font-weight: bold; color: #ffffff; margin-bottom: 12px; border-bottom: 2px solid #106eba; padding-bottom: 4px; }
        .update-item { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .update-link { text-decoration: none; font-weight: bold; color: #d13438; display: block; margin-bottom: 2px; }
        .date { font-size: 11px; color: #ddd; }
    </style>
</head>
<body>
    <div class="title">Current Microsoft Security Releases</div>
    <div id="content">Loading live patch data...</div>

  <script>
    fetch('feed.xml')
        .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
        })
        .then(text => {
            const xml = new DOMParser().parseFromString(text, 'application/xml');
            const container = document.getElementById('content');
            container.innerHTML = '';

            const items = [...xml.querySelectorAll('item, entry')].slice(0, 15);
            if (!items.length) { container.innerText = 'No updates found.'; return; }

            items.forEach(item => {
                const get = tag => item.querySelector(tag)?.textContent?.trim() || '';
                const title = get('title');
                const link = get('link') || item.querySelector('link')?.getAttribute('href') || '#';
                const dateStr = get('pubDate') || get('updated') || get('published');
                const date = dateStr ? new Date(dateStr).toLocaleDateString() : '';

                const div = document.createElement('div');
                div.className = 'update-item';

                const a = document.createElement('a');
                a.className = 'update-link';
                a.href = link;
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = title;

                const span = document.createElement('span');
                span.className = 'date';
                span.textContent = date ? 'Published: ' + date : '';

                div.append(a, span);
                container.appendChild(div);
            });
        })
        .catch(err => {
            console.error(err);
            document.getElementById('content').innerText = 'Error loading feed.';
        });
</script>
</body>
</html>
